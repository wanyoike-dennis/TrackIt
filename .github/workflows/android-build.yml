name: Android build verification

on:
  push:
    branches:
      - feature/financial-intelligence-ux-features
  pull_request:
    branches:
      - main
      - feature/transaction-entry

permissions:
  contents: read

jobs:
  android-build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace
